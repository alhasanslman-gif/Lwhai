<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050817"><title>LWHAI Hope Journey</title>
<style>
:root{--bg:#050817;--bg2:#070b20;--p:#111936;--p2:#172348;--purple:#725CFF;--cyan:#00D2D3;--green:#55EFC4;--yellow:#FFE66D;--pink:#FF79B0;--text:#f7f8ff;--muted:#aeb9dc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#1a2860,transparent 40%),var(--bg);color:var(--text);font-family:system-ui,Tahoma,sans-serif;overflow-x:hidden}.stars{position:fixed;inset:0;pointer-events:none;opacity:.3;background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(#7eeeff 1px,transparent 1px);background-size:97px 113px,173px 151px;animation:stars 35s linear infinite}@keyframes stars{to{transform:translate(-80px,100px)}}button{font:inherit;color:inherit;cursor:pointer;border:0}.screen{position:relative;z-index:1;max-width:1050px;margin:auto;padding:18px 14px 105px;animation:in .3s}@keyframes in{from{opacity:0;transform:translateY(8px)}}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{display:flex;align-items:center;gap:9px;font-weight:800}.logo{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:linear-gradient(135deg,var(--purple),var(--cyan));box-shadow:0 0 25px #725cff88}.pill,.card{background:linear-gradient(145deg,#172348e8,#0c1431e8);border:1px solid #344276aa;box-shadow:0 15px 50px #0007;border-radius:20px}.pill{padding:9px 13px;color:var(--yellow);font-weight:800}.card{padding:18px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:15px}.eyebrow{color:var(--cyan);font-weight:800;letter-spacing:2px}.hero h1{font-size:clamp(2rem,6vw,4rem);line-height:1.05;margin:12px 0;background:linear-gradient(90deg,#fff,var(--cyan),var(--pink));-webkit-background-clip:text;color:transparent}.muted{color:var(--muted)}.btn{min-height:46px;padding:11px 16px;border-radius:13px;background:linear-gradient(135deg,var(--purple),#4b8dff);font-weight:800;box-shadow:0 8px 20px #725cff55}.btn.secondary{background:#ffffff10;border:1px solid #344276;box-shadow:none}.btn.green{background:linear-gradient(135deg,#159f9c,var(--green));color:#06151d}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.stats,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat{padding:12px;background:#ffffff09;border:1px solid #ffffff12;border-radius:15px}.stat b{display:block;font-size:1.25rem}.stat small{color:var(--muted)}.progress{height:10px;background:#080d22;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan))}.shipart{min-height:260px;display:grid;place-items:center;background:radial-gradient(circle,#254480,#111936 45%,transparent 72%)}.avatar{font-size:75px;filter:drop-shadow(0 0 14px var(--pink))}.ship{font-size:92px;filter:drop-shadow(0 0 22px var(--cyan));animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-12px)}}.section{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:24px 0 12px}.section h1,.section h2{margin:0}.grid{grid-template-columns:repeat(2,1fr)}.upgrade,.mission{display:flex;align-items:center;gap:12px}.upgrade .icon,.mission .icon{font-size:2rem}.upgrade p,.mission p{margin:4px 0;color:var(--muted);font-size:.88rem}.upgrade .btn{margin-inline-start:auto;padding:8px 10px}.tag{font-size:.75rem;color:var(--cyan);border:1px solid #00d2d355;padding:3px 7px;border-radius:20px}.nav{position:fixed;z-index:5;bottom:0;inset-inline:0;display:flex;justify-content:center;gap:2px;padding:8px;background:#080d22ee;border-top:1px solid #344276;backdrop-filter:blur(14px)}.nav button{background:transparent;color:var(--muted);padding:8px 10px;border-radius:12px;font-size:.72rem}.nav button.active,.nav button:hover{background:#725cff26;color:#fff}.game{max-width:700px;margin:auto}.hud{display:flex;justify-content:space-between;margin-bottom:10px}.gamebox{border:1px solid var(--cyan);border-radius:20px;overflow:hidden;box-shadow:0 0 35px #00d2d344}.gamebox canvas{width:100%;height:min(65vh,500px);display:block;touch-action:none}.controls{display:flex;justify-content:center;gap:15px;margin-top:12px}.control{width:65px;height:50px;background:#ffffff12;border:1px solid #344276;border-radius:15px}.list{display:grid;gap:10px}.notice{border-inline-start:3px solid var(--yellow);padding:11px;background:#ffe66d12;color:#fff1aa;border-radius:8px}.startup{position:fixed;z-index:20;inset:0;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#202e70,#050817 65%);transition:.6s}.startup.out{opacity:0;pointer-events:none}.startup h1{font-size:clamp(2.5rem,10vw,5rem);margin:12px;background:linear-gradient(90deg,var(--cyan),#fff,var(--pink));-webkit-background-clip:text;color:transparent}.toast{position:fixed;z-index:30;bottom:90px;left:50%;transform:translateX(-50%);background:#172348f5;border:1px solid var(--cyan);padding:13px 18px;border-radius:14px;max-width:90%;text-align:center}a{color:var(--cyan)}footer{text-align:center;color:var(--muted);margin-top:28px;font-size:.85rem}@media(max-width:700px){.hero{grid-template-columns:1fr}.grid,.stats{grid-template-columns:1fr 1fr}.nav button{font-size:.63rem;padding:8px 6px}}
</style></head>
<body><div class="stars"></div><div id="startup" class="startup"><div><div class="logo">◈</div><h1>LWHAI</h1><h2>Hope Journey</h2><p class="muted">رحلتك تبدأ من هنا</p></div></div><main id="app"></main><nav id="nav" class="nav"></nav><div id="toast"></div>
<script>
'use strict';
const KEY='lwhai_v4';const defaults=()=>({player:{level:1,xp:0,crystals:40,completed:0},ship:{energy:1,shield:1,navigation:1,scanner:1,rescue:1},base:{command:1,energy:1,garden:1,robots:1,deck:1,lab:1},missions:[{id:'water',title:'تذكير الماء',icon:'💧',done:false},{id:'daily',title:'مهمة الطاقة اليومية',icon:'⭐',done:false}],settings:{sound:false},parent:{pin:''},stats:{crystals:0,score:0}});let state=load(),screen='home',game=null;function load(){try{return Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return defaults()}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function need(){return 300+(state.player.level-1)*100}function xp(n){state.player.xp+=n;while(state.player.xp>=need()){state.player.xp-=need();state.player.level++;toast('مستوى جديد! ⭐')}}function toast(x){document.querySelector('#toast').textContent=x;setTimeout(()=>document.querySelector('#toast').textContent='',2400)}function go(x){stop();screen=x;history.pushState({screen:x},'', '#'+x);render()}function stop(){if(game){cancelAnimationFrame(game.raf);clearInterval(game.timer);game=null}}window.onpopstate=e=>{screen=e.state?.screen||'home';stop();render()};const navs={home:'🚀 رحلتي',game:'🎮 اللعبة',missions:'⭐ مهامي',base:'🏠 قاعدتي',ship:'🛸 مركبتي',parent:'⚙️ التحكم'};function render(){document.querySelector('#nav').innerHTML=Object.entries(navs).map(([k,v])=>`<button class="${screen===k?'active':''}" data-go="${k}">${v}</button>`).join('');let body=screen==='home'?home():screen==='missions'?missions():screen==='base'?upgrades('base',baseNames,'🏠 قاعدتي'):screen==='ship'?upgrades('ship',shipNames,'🛸 مركبتي'):screen==='parent'?parent():screen==='game'?gamePage():home();document.querySelector('#app').innerHTML=`<section class="screen"><div class="top"><div class="brand"><div class="logo">◈</div>LWHAI <span class="muted">Hope Journey</span></div><div class="pill">💎 ${state.player.crystals}</div></div>${body}<footer>Learning with Human & AI (LWHAI)<br>Every small step is part of the journey.</footer></section>`}function home(){let p=state.player,n=need();return `<div class="hero"><div class="card"><div class="eyebrow">YOUR JOURNEY · رحلتك مستمرة</div><h1>كل خطوة صغيرة<br>تصنع فرقاً كبيراً.</h1><p class="muted">أنت مستكشف شجاع. اجمع الطاقة وطوّر عالمك الفضائي.</p><div class="stats"><div class="stat"><b>LEVEL ${String(p.level).padStart(2,'0')}</b><small>مستواك</small></div><div class="stat"><b>${p.xp}/${n}</b><small>XP</small></div><div class="stat"><b>${p.completed}</b><small>مهمات مكتملة</small></div></div><div class="progress"><i style="width:${p.xp/n*100}%"></i></div><div class="actions"><button class="btn" data-action="start">ابدأ المهمة 🚀</button><button class="btn secondary" data-go="missions">مهامي ⭐</button></div></div><div class="card shipart"><div class="avatar">🧑‍🚀</div><div class="ship">🚀</div></div></div><div class="section"><h2>المهمة الحالية</h2><button class="btn secondary" data-go="base">زيارة القاعدة</button></div><div class="card mission"><div class="icon">🌌</div><div><b>رحلة ضوء الأمل</b><p>اجمع الطاقة ووصل إلى بوابة النجوم.</p></div></div><p class="notice">أنت لست وحدك. رحلتك تستحق أن تُحتفل بها 💜</p>`}function missions(){return `<div class="section"><h1>⭐ مهامي</h1><button class="btn" data-action="add">+ مهمة</button></div><p class="muted">المهمات الإيجابية تكافئ محاولتك. لا توجد عقوبات.</p><div class="list">${state.missions.map(m=>`<div class="card mission"><div class="icon">${m.icon}</div><div style="flex:1"><b>${safe(m.title)}</b><p>+25 XP · +10 Crystals</p></div>${m.done?'<span class="tag">مكتملة ✓</span>':`<button class="btn green" data-complete="${m.id}">إكمال</button>`}</div>`).join('')}</div>`}const shipNames={energy:['⚡','نواة الطاقة','تزيد وقت الرحلة'],shield:['🛡️','درع الطاقة','حماية لطيفة'],navigation:['🧭','الملاحة','تحكم أفضل'],scanner:['🔭','ماسح الاكتشاف','يكشف البلورات'],rescue:['🤖','نظام الإنقاذ','يساعد الروبوتات']};const baseNames={command:['🛰️','مركز القيادة','قلب القاعدة'],energy:['🔋','��حطة الطاقة','طاقة نظيفة'],garden:['🌱','الحديقة الفضائية','مكان هادئ'],robots:['🤖','محطة الروبوتات','أصدقاء جدد'],deck:['🔭','منصة المراقبة','شاهد النجوم'],lab:['💎','مختبر البلورات','اكتشافات نادرة']};function upgrades(type,names,title){return `<div class="section"><h1>${title}</h1><button class="btn secondary" data-go="home">العودة</button></div><div class="grid">${Object.entries(names).map(([k,v])=>{let l=state[type][k],cost=l*20;return `<div class="card upgrade"><div class="icon">${v[0]}</div><div style="flex:1"><b>${v[1]}</b><p>${v[2]}</p><span class="tag">LEVEL ${l}</span></div><button class="btn" data-up="${type}:${k}">${l>=5?'MAX':'💎 '+cost}</button></div>`}).join('')}</div>`}function parent(){return `<div class="section"><h1>⚙️ غرفة التحكم</h1></div><div class="card"><h3>منطقة الوالدين</h3><p class="muted">PIN تجريبي محلي، وليس حماية أمنية حقيقية.</p><input id="pin" inputmode="numeric" maxlength="6" placeholder="أنشئ أو أدخل PIN" style="padding:12px;width:100%;background:#080d22;color:white;border:1px solid #344276;border-radius:10px"><button class="btn" data-action="pin" style="margin-top:10px">حفظ / فتح</button></div><div class="card" style="margin-top:12px"><h3>ABOUT LWHAI</h3><p>Learning with Human & AI (LWHAI)<br>Eng Alhasan M Slman</p><a href="https://www.facebook.com/" target="_blank">Facebook: Learning with Human & AI</a><br><a href="https://www.linkedin.com/" target="_blank">LinkedIn: Alhasan Slman</a><p class="notice">هذا التطبيق تجربة تفاعلية لدعم الطفل وتحفيزه، ولا يقدم تشخيصاً أو علاجاً طبياً. يحدد ولي الأمر أو المختص معلومات العلاج والأدوية والمواعيد.</p></div>`}function gamePage(){return `<div class="game"><div class="section"><h2>رحلة ضوء ��لأمل</h2><button class="btn secondary" data-action="quit">إنهاء</button></div><div class="hud"><span class="pill">💎 <b id="gc">0</b></span><span class="pill">⭐ <b id="gs">0</b></span><span class="pill">⏱️ <b id="gt">60</b></span></div><div class="gamebox"><canvas id="canvas" width="700" height="500"></canvas></div><div class="controls"><button class="control" data-move="left">◀</button><button class="control" data-action="pause">Ⅱ</button><button class="control" data-move="right">▶</button></div><p class="muted">حرّك المركبة واجمع البلورات وتجنب العقبات اللطيفة.</p></div>`}
function start(){screen='game';game={x:350,score:0,cr:0,time:60,left:false,right:false,paused:false,items:[],obs:[],last:0};render();game.c=document.querySelector('#canvas');game.ctx=game.c.getContext('2d');for(let i=0;i<10;i++){game.items.push({x:30+Math.random()*640,y:-i*80});if(i%2)game.obs.push({x:30+Math.random()*640,y:-i*130-100})}game.timer=setInterval(()=>{if(!game.paused&&--game.time<=0)finish()},1000);game.raf=requestAnimationFrame(loop);history.pushState({screen:'game'},'','#game')}function loop(t){if(!game)return;let d=Math.min(35,t-(game.last||t-16));game.last=t;if(!game.paused){game.x+=((game.right?1:0)-(game.left?1:0))*d*.35;game.x=Math.max(20,Math.min(680,game.x));game.items.forEach(o=>o.y+=d*.14);game.obs.forEach(o=>o.y+=d*.1);game.items.forEach(o=>{if(o.y>430&&o.y<490&&Math.abs(o.x-game.x)<30){o.y=600;game.cr++;game.score+=10}});game.obs.forEach(o=>{if(o.y>430&&o.y<490&&Math.abs(o.x-game.x)<35){o.y=600;game.score=Math.max(0,game.score-2)}});draw();document.querySelector('#gc').textContent=game.cr;document.querySelector('#gs').textContent=game.score;document.querySelector('#gt').textContent=Math.max(0,game.time)}game.raf=requestAnimationFrame(loop)}function draw(){let c=game.ctx;c.clearRect(0,0,700,500);c.fillStyle='#070b20';c.fillRect(0,0,700,500);c.fillStyle='#fff';for(let i=0;i<45;i++)c.fillRect((i*97)%700,(i*53+Date.now()*.015)%500,2,2);game.items.forEach(o=>{c.fillStyle='#00d2d3';c.shadowBlur=18;c.shadowColor='#00d2d3';c.beginPath();c.arc(o.x,o.y,10,0,7);c.fill()});c.shadowBlur=0;game.obs.forEach(o=>{c.fillStyle='#ff79b0';c.beginPath();c.arc(o.x,o.y,18,0,7);c.fill()});c.font='42px sans-serif';c.textAlign='center';c.fillText('🚀',game.x,465)}function finish(){let g=game;stop();xp(25+Math.floor(g.score/10));state.player.crystals+=10+g.cr;state.stats.crystals+=10+g.cr;state.stats.score=Math.max(state.stats.score,g.score);save();go('home');toast(`MISSION COMPLETE · +XP و +${10+g.cr} 💎`)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.go)go(b.dataset.go);if(b.dataset.action==='start')start();if(b.dataset.action==='quit')go('home');if(b.dataset.action==='pause'&&game)game.paused=!game.paused;if(b.dataset.action==='add'){let t=prompt('عنوان مهمة إيجابية يحددها الوالد:');if(t){state.missions.push({id:Date.now()+'',title:t,icon:'⭐',done:false});save();render()}}if(b.dataset.action==='pin'){let x=document.querySelector('#pin').value;if(state.parent.pin&&x===state.parent.pin)toast('تم فتح المنطقة');else if(x.length>=4){state.parent.pin=x;save();toast('تم حفظ PIN التجريبي')}else toast('استخدم 4 أرقام على الأقل')}if(b.dataset.complete){let m=state.missions.find(x=>x.id===b.dataset.complete);m.done=true;state.player.completed++;xp(25);state.player.crystals+=10;save();render();toast('ممتاز! +10 بلورات')}if(b.dataset.up){let [t,k]=b.dataset.up.split(':'),l=state[t][k],cost=l*20;if(l<5&&state.player.crystals>=cost){state.player.crystals-=cost;state[t][k]++;save();render();toast('تم التطوير بنجاح ✨')}else toast('تحتاج إلى بلورات أكثر 💎')}if(b.dataset.move&&game){game[b.dataset.move]=true;setTimeout(()=>game&&(game[b.dataset.move]=false),180)}});document.addEventListener('keydown',e=>{if(game){if(e.key==='ArrowLeft')game.left=true;if(e.key==='ArrowRight')game.right=true}});document.addEventListener('keyup',e=>{if(game){if(e.key==='ArrowLeft')game.left=false;if(e.key==='ArrowRight')game.right=false}});function safe(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}setTimeout(()=>{document.querySelector('#startup').classList.add('out');render()},850);
</script></body></html>
